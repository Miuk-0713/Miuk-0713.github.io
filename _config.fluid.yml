# Fluid 主题配置覆盖文件

# ---------------------------
# 全局图标
# ---------------------------
favicon: /img/favicon.svg
apple_touch_icon: /img/favicon.svg

# ---------------------------
# 导航栏
# ---------------------------
navbar:
  blog_title: "Miuk's Space"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }
    - { key: "写文章", link: "/write/", icon: "iconfont icon-articles", name: "写文章" }

# ---------------------------
# 首页
# ---------------------------
index:
  banner_img: /img/default.png
  slogan:
    enable: true
    text: "代码即诗，行胜于言。"
    typing:
      enable: true
      loop: true

# ---------------------------
# 底部页脚
# ---------------------------
footer:
  content: |
    <a href="https://miuk-0713.github.io" target="_blank" rel="noopener">Miuk's Space</a>
    &copy; 2024 Miuk
    <br>
    本站采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> 许可协议，转载请注明出处。
  statistics:
    enable: true
    source: "busuanzi"
    pv_format: "总访问量 {} 次"
    uv_format: "总访客数 {} 人"

# ---------------------------
# Web 分析
# ---------------------------
web_analytics:
  enable: true
  follow_dnt: true

# ---------------------------
# 代码块
# ---------------------------
code:
  copy:
    enable: true
    highlight: "复制成功"
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    bg_color: false
  mac_window: true

# ---------------------------
# 自定义样式（Mac 风格代码块圆点）
# ---------------------------
custom_css:
  - /css/mac-code.css

# ---------------------------
# 搜索
# ---------------------------
search:
  enable: true
  path: /search.xml
  field: post
  content: true
  format: html

# ---------------------------
# 文章评论
# ---------------------------
post:
  comments:
    enable: true
    type: giscus
  meta:
    wordcount:
      enable: true
      format: "{} 字"
    min2read:
      enable: true
      format: "{} 分钟"
  math:
    enable: true
    specific: false
    engine: "katex"

giscus:
  repo: 'Miuk-0713/Miuk-0713.github.io'
  repo-id: 'R_kgDOUNH9qQ'
  category: 'General'
  category-id: 'DIC_kwDOUNH9qc4DEzIw'
  mapping: 'pathname'
  reactions-enabled: 1
  emit-metadata: 0
  input-position: 'top'
  theme-light: 'light'
  theme-dark: 'dark'
  lang: 'zh-CN'

# ---------------------------
# 关于页
# ---------------------------
about:
  enable: true
  banner_img: /img/default.png
  avatar: /img/avatar.svg